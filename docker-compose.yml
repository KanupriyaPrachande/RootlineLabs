version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rootline-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: rootline-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  qdrant_storage:
